name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run unit tests, Fabric GameTests, and build
        run: ./gradlew --no-daemon clean test build

      - name: Verify release JAR and write checksum
        shell: bash
        run: |
          artifact_count="$(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' -print | wc -l
          )"
          artifact="$(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' -print -quit
          )"

          if [[ "$artifact_count" -ne 1 ]]; then
            printf 'Expected exactly one release JAR, found %s\n' \
              "$artifact_count" >&2
            exit 1
          fi

          expected_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_name="pearlrelay-${expected_version}.jar"

          if [[ "$(basename "$artifact")" != "$expected_name" ]]; then
            printf 'Unexpected release JAR: %s (expected %s)\n' \
              "$(basename "$artifact")" "$expected_name" >&2
            exit 1
          fi

          if ! unzip -p "$artifact" fabric.mod.json \
            | grep -Fq "\"version\": \"${expected_version}\""; then
            printf 'fabric.mod.json does not contain version %s\n' \
              "$expected_version" >&2
            exit 1
          fi

          mkdir -p build/checksums
          (
            cd build/libs
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$expected_name"
            else
              shasum -a 256 "$expected_name"
            fi
          ) > build/checksums/SHA256SUMS
          cat build/checksums/SHA256SUMS

      - name: Upload release JAR and checksum
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pearlrelay-${{ github.sha }}
          path: |
            build/libs/pearlrelay-*.jar
            !build/libs/*-sources.jar
            build/checksums/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            build/run/gameTest/logs/latest.log
          if-no-files-found: warn
          retention-days: 14

  client-e2e:
    name: Java 25 production client GameTest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Ensure XVFB is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes xvfb
          fi
          xvfb-run --help >/dev/null

      - name: Build the release and client test-support JARs
        run: ./gradlew --no-daemon clean jar gametestJar

      - name: Record the tested release identity
        shell: bash
        run: |
          expected_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_name="pearlrelay-${expected_version}.jar"
          artifact="build/libs/${expected_name}"

          if [[ ! -f "$artifact" ]]; then
            printf 'Missing expected release JAR: %s\n' "$artifact" >&2
            exit 1
          fi

          if unzip -l "$artifact" \
            | grep -Eq 'pearlrelay/test|pearlrelay-gametest'; then
            printf 'Release JAR contains client test code: %s\n' \
              "$artifact" >&2
            exit 1
          fi

          mkdir -p build/client-e2e-evidence
          (
            cd build/libs
            sha256sum "$expected_name"
          ) > build/client-e2e-evidence/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" \
            > build/client-e2e-evidence/COMMIT_SHA
          printf '%s\n' "$expected_name" \
            > build/client-e2e-evidence/RELEASE_JAR
          cat build/client-e2e-evidence/SHA256SUMS

      - name: Run production client GameTests
        run: ./gradlew --no-daemon runProductionClientGameTest

      - name: Verify the tested release and Fabric API version
        shell: bash
        run: |
          expected_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_name="pearlrelay-${expected_version}.jar"
          fabric_api_version="$(
            sed -n 's/^fabric_api_version=//p' gradle.properties
          )"

          (
            cd build/libs
            sha256sum --check ../client-e2e-evidence/SHA256SUMS
          )
          grep -Fq \
            "fabric-api ${fabric_api_version}" \
            build/run/productionClientGameTest/logs/latest.log
          test -f "build/libs/${expected_name}"

      - name: Upload the tested release JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-client-candidate-${{ github.sha }}
          path: |
            build/libs/pearlrelay-*.jar
            !build/libs/*-sources.jar
            !build/libs/pearlrelay-gametest-*.jar
            build/client-e2e-evidence/SHA256SUMS
            build/client-e2e-evidence/COMMIT_SHA
            build/client-e2e-evidence/RELEASE_JAR
          if-no-files-found: error
          retention-days: 14

      - name: Upload client GameTest evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-client-evidence-${{ github.sha }}
          path: |
            build/client-e2e-evidence/
            build/run/productionClientGameTest/logs/
            build/run/productionClientGameTest/screenshots/
            build/run/productionClientGameTest/crash-reports/
          if-no-files-found: warn
          retention-days: 14
